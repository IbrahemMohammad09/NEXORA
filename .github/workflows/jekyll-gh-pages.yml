name: Deploy Vite React App from Subfolder

on:
  push:
    branches: ['main'] # أو master إذا كان اسم الفرع عندك master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # الدخول للمجلد الفرعي وتثبيت الحزم
      - name: Install dependencies
        run: npm install
        working-directory: ./YOUR_SUBFOLDER_NAME # 👈 استبدل اسم المجلد الفرعي هنا

      # بناء المشروع داخل المجلد الفرعي
      - name: Build project
        run: npm run build
        working-directory: ./YOUR_SUBFOLDER_NAME # 👈 واستبدله هنا أيضاً

      # تجهيز صفحات GitHub
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # رفع الملفات الناتجة من مجلد dist
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./YOUR_SUBFOLDER_NAME/dist # 👈 استبدله هنا أيضاً

      # النشر على GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
